    <text x="218" y="112" fill="#ff5500" font-family="Consolas, monospace" font-size="48">true</text>
    <path d="M30 140H335" stroke="#302c25"/>
    <text x="30" y="182" fill="#948978" font-family="Consolas, monospace" font-size="15">VERIFY ≠ ALLOW</text>
    <path d="M30 218H335" stroke="#ff5500" stroke-width="3"/>
