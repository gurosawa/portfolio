  <text x="66" y="415" fill="#948978" font-family="Arial, Pretendard, sans-serif" font-size="24">검증에 성공해도 서비스의 최종 허용은 별도 판단이다.</text>
  <g transform="translate(755 150)">
    <rect width="365" height="250" fill="#11100e" stroke="#ff5500"/>
    <text x="30" y="48" fill="#948978" font-family="Consolas, monospace" font-size="16">premium.example</text>
